name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            artifact: KeyPro-macos
          - os: windows-latest
            artifact: KeyPro-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional integrations
        run: python -m pip install --upgrade pip pyautogui pynput pytesseract Pillow pyinstaller
      - name: Build app bundle
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python build.py --target windows
          else
            python build.py --target mac
          fi
      - name: Zip artifact (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/KeyPro.app dist/KeyPro-macos.zip
      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/KeyPro -DestinationPath dist/KeyPro-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip
