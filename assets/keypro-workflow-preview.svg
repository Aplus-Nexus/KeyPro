<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" rx="18" fill="#0B1020"/>
  <rect x="0" y="0" width="1440" height="78" fill="#0B1020"/>
  <text x="28" y="47" fill="#2DD4BF" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700">✦</text>
  <text x="70" y="45" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">KeyPro</text>
  <text x="181" y="44" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="14">/ flow studio</text>
  <rect x="1022" y="22" width="74" height="35" rx="8" fill="#151F36"/>
  <text x="1043" y="45" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="13">Save</text>
  <rect x="1104" y="22" width="74" height="35" rx="8" fill="#151F36"/>
  <text x="1124" y="45" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="13">Open</text>
  <rect x="1186" y="22" width="88" height="35" rx="8" fill="#151F36"/>
  <text x="1206" y="45" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="13">Preview</text>
  <rect x="1282" y="22" width="134" height="35" rx="8" fill="#8B5CF6"/>
  <text x="1300" y="45" fill="#FFFFFF" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">Run workflow</text>

  <rect x="20" y="96" width="218" height="752" rx="12" fill="#11182B" stroke="#263453"/>
  <text x="42" y="130" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACTION LIBRARY</text>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="45" y="174" fill="#A78BFA" font-size="22">↻</text><text x="78" y="169" fill="#EDF2FF" font-size="14" font-weight="700">Loop</text><text x="78" y="188" fill="#8291B5" font-size="11">Repeat until stopped</text>
    <text x="45" y="230" fill="#2DD4BF" font-size="22">◷</text><text x="78" y="225" fill="#EDF2FF" font-size="14" font-weight="700">Delay</text><text x="78" y="244" fill="#8291B5" font-size="11">Pause for a duration</text>
    <text x="45" y="286" fill="#2DD4BF" font-size="22">⌨</text><text x="78" y="281" fill="#EDF2FF" font-size="14" font-weight="700">Type text</text><text x="78" y="300" fill="#8291B5" font-size="11">Insert into active field</text>
    <text x="45" y="342" fill="#2DD4BF" font-size="22">⌖</text><text x="78" y="337" fill="#EDF2FF" font-size="14" font-weight="700">Move cursor</text><text x="78" y="356" fill="#8291B5" font-size="11">Point or OCR target</text>
    <text x="45" y="398" fill="#2DD4BF" font-size="22">◉</text><text x="78" y="393" fill="#EDF2FF" font-size="14" font-weight="700">Click</text><text x="78" y="412" fill="#8291B5" font-size="11">Mouse button action</text>
    <text x="45" y="454" fill="#2DD4BF" font-size="22">⌘</text><text x="78" y="449" fill="#EDF2FF" font-size="14" font-weight="700">Hotkey</text><text x="78" y="468" fill="#8291B5" font-size="11">Press a key combination</text>
    <text x="45" y="510" fill="#2DD4BF" font-size="22">{}</text><text x="78" y="505" fill="#EDF2FF" font-size="14" font-weight="700">Run script</text><text x="78" y="524" fill="#8291B5" font-size="11">Run a Python snippet</text>
  </g>
  <line x1="42" y1="560" x2="216" y2="560" stroke="#263453"/>
  <text x="42" y="593" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">WORKSPACE</text>
  <text x="42" y="630" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="13">⌗  Keyboard map</text>
  <text x="42" y="664" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="13">⌁  Run history</text>
  <text x="42" y="698" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="13">⚙  Preferences</text>
  <text x="42" y="818" fill="#A78BFA" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Aplus-Nexus</text>

  <text x="270" y="130" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700">Submit form repeatedly</text>
  <text x="270" y="155" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="13">/ draft</text>
  <text x="820" y="155" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">Ctrl + Alt + 5 stops the run</text>
  <rect x="260" y="182" width="790" height="666" rx="12" fill="#11182B" stroke="#263453"/>
  <text x="284" y="220" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700">Workflow</text>
  <text x="360" y="220" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">6 steps</text>
  <rect x="930" y="198" width="98" height="32" rx="8" fill="#151F36"/><text x="948" y="219" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="12">+ Add step</text>
  <line x1="260" y1="244" x2="1050" y2="244" stroke="#263453"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="282" y="264" width="746" height="76" rx="8" fill="#1B2742"/><rect x="282" y="264" width="4" height="76" rx="2" fill="#8B5CF6"/><text x="302" y="292" fill="#8291B5" font-size="11" font-weight="700">01</text><text x="340" y="296" fill="#A78BFA" font-size="22">↻</text><text x="382" y="291" fill="#EDF2FF" font-size="14" font-weight="700">Loop until stopped</text><text x="382" y="314" fill="#8291B5" font-size="12">Until Ctrl + Alt + 5 is pressed</text><text x="972" y="300" fill="#8291B5" font-size="16">↑  ↓  ×</text>
    <rect x="282" y="350" width="746" height="76" rx="8" fill="#151F36"/><rect x="282" y="350" width="4" height="76" rx="2" fill="#F6C453"/><text x="302" y="378" fill="#8291B5" font-size="11" font-weight="700">02</text><text x="340" y="382" fill="#F6C453" font-size="22">◷</text><text x="382" y="377" fill="#EDF2FF" font-size="14" font-weight="700">Wait 2 seconds</text><text x="382" y="400" fill="#8291B5" font-size="12">2 seconds</text>
    <rect x="282" y="436" width="746" height="76" rx="8" fill="#151F36"/><rect x="282" y="436" width="4" height="76" rx="2" fill="#2DD4BF"/><text x="302" y="464" fill="#8291B5" font-size="11" font-weight="700">03</text><text x="340" y="468" fill="#2DD4BF" font-size="22">⌨</text><text x="382" y="463" fill="#EDF2FF" font-size="14" font-weight="700">Type text</text><text x="382" y="486" fill="#8291B5" font-size="12">'AAAA'</text>
    <rect x="282" y="522" width="746" height="76" rx="8" fill="#151F36"/><rect x="282" y="522" width="4" height="76" rx="2" fill="#A78BFA"/><text x="302" y="550" fill="#8291B5" font-size="11" font-weight="700">04</text><text x="340" y="554" fill="#A78BFA" font-size="22">⌖</text><text x="382" y="549" fill="#EDF2FF" font-size="14" font-weight="700">Find submit button</text><text x="382" y="572" fill="#8291B5" font-size="12">640, 420 · OCR target: Submit</text>
    <rect x="282" y="608" width="746" height="76" rx="8" fill="#151F36"/><rect x="282" y="608" width="4" height="76" rx="2" fill="#A78BFA"/><text x="302" y="636" fill="#8291B5" font-size="11" font-weight="700">05</text><text x="340" y="640" fill="#A78BFA" font-size="22">◉</text><text x="382" y="635" fill="#EDF2FF" font-size="14" font-weight="700">Click mouse</text><text x="382" y="658" fill="#8291B5" font-size="12">Left button · 1 click</text>
    <rect x="282" y="694" width="746" height="76" rx="8" fill="#151F36"/><rect x="282" y="694" width="4" height="76" rx="2" fill="#2DD4BF"/><text x="302" y="722" fill="#8291B5" font-size="11" font-weight="700">06</text><text x="340" y="726" fill="#2DD4BF" font-size="22">⌘</text><text x="382" y="721" fill="#EDF2FF" font-size="14" font-weight="700">Press shortcut</text><text x="382" y="744" fill="#8291B5" font-size="12">Ctrl + Enter</text>
  </g>

  <rect x="1070" y="96" width="350" height="752" rx="12" fill="#11182B" stroke="#263453"/>
  <text x="1096" y="130" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">INSPECTOR</text>
  <text x="1096" y="171" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Step name</text>
  <rect x="1096" y="184" width="298" height="38" rx="7" fill="#1B2742"/><text x="1110" y="208" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="13">Loop until stopped</text>
  <text x="1096" y="257" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Action</text>
  <text x="1096" y="289" fill="#2DD4BF" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700">Loop</text>
  <text x="1096" y="343" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Stop shortcut</text>
  <rect x="1096" y="356" width="298" height="38" rx="7" fill="#1B2742"/><text x="1110" y="380" fill="#EDF2FF" font-family="Helvetica, Arial, sans-serif" font-size="13">Ctrl + Alt + 5</text>
  <text x="1096" y="430" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Iterations (optional)</text>
  <rect x="1096" y="443" width="298" height="38" rx="7" fill="#1B2742"/><text x="1110" y="467" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="13">∞</text>
  <line x1="1096" y1="526" x2="1394" y2="526" stroke="#263453"/>
  <text x="1096" y="560" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3">RUN SAFETY</text>
  <text x="1096" y="592" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">Ctrl + Alt + 5 always stops the</text><text x="1096" y="612" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">active run. Preview never touches</text><text x="1096" y="632" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">your cursor.</text>
  <rect x="0" y="862" width="1440" height="38" fill="#151F36"/><text x="26" y="886" fill="#8291B5" font-family="Helvetica, Arial, sans-serif" font-size="12">Ready to compose</text><text x="1300" y="886" fill="#2DD4BF" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Idle</text>
</svg>
